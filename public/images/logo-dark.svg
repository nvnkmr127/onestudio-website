<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 420" width="1150" height="420">
  <!-- Architectural Three-Nested Arches Monogram -->
  <g fill="none" stroke="#3A3A3A" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer Arch with Bottom Base Bar -->
    <path d="M 25 390 L 25 150 A 135 135 0 0 1 295 150 L 295 390 L 25 390 Z" />
    
    <!-- Middle Arch -->
    <path d="M 75 390 L 75 190 A 85 85 0 0 1 245 190 L 245 390" />
    
    <!-- Inner Arch Monogram Swoop -->
    <path d="M 125 390 L 125 235 A 40 40 0 0 1 205 235 C 205 330, 115 310, 115 285 C 115 260, 195 260, 205 390" />
  </g>

  <!-- Serif ONE Typography -->
  <text x="360" y="235" fill="#3A3A3A" font-family="Georgia, 'Times New Roman', serif" font-size="210" font-weight="700" letter-spacing="22">ONE</text>

  <!-- Tracked Sans-Serif STUDIO Typography -->
  <text x="375" y="365" fill="#3A3A3A" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="78" font-weight="600" letter-spacing="46">STUDIO</text>
</svg>
